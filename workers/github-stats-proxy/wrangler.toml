name = "github-stats-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[kv_namespaces]]
binding = "GITHUB_STATS_CACHE"
id = "007122d1ca814aec983812cf8c7db2d5"

# Per caller IP, for requests that miss the cache and would call GitHub.
# Counted per Cloudflare location.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1005"

  [ratelimits.simple]
  limit = 30
  period = 60
